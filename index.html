<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
  />
  <meta name="theme-color" content="#0a0e14" />
  <title>Delica Style Navi</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#07090d;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }

    body{
      touch-action:manipulation;
    }

    button,input{
      font-family:inherit;
    }

    button{
      cursor:pointer;
      border:0;
      outline:0;
    }

    :root{
      --bg:#0a0e14;
      --panel:#0f1620;
      --panel2:#121c28;
      --line:rgba(150,200,255,.15);
      --blue:#54b7ff;
      --blue2:#99dcff;
      --text2:#a5b8c9;
      --shadow:0 14px 38px rgba(0,0,0,.45);
      --wood1:#4a2415;
      --wood2:#2d140d;
      --wood3:#5b2f1d;
    }

    #opening{
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:
        radial-gradient(circle at center, rgba(70,140,220,.14), transparent 34%),
        linear-gradient(180deg,#020304,#091018 55%,#020304);
      transition:opacity .85s ease, visibility .85s ease;
    }

    #opening.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .openingGlow{
      position:absolute;
      width:70vw;
      height:70vw;
      max-width:780px;
      max-height:780px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(84,183,255,.18), transparent 70%);
      filter:blur(34px);
      animation:glow 3.6s ease-in-out infinite;
    }

    .openingSweep{
      position:absolute;
      top:0;
      bottom:0;
      width:180px;
      left:-220px;
      transform:skewX(-18deg);
      filter:blur(10px);
      background:linear-gradient(
        90deg,
        transparent,
        rgba(84,183,255,.04),
        rgba(84,183,255,.16),
        rgba(255,255,255,.25),
        rgba(84,183,255,.12),
        transparent
      );
      animation:sweep 2.8s ease .2s forwards;
    }

    .openingCenter{
      position:relative;
      text-align:center;
      z-index:3;
    }

    .openingMark{
      width:92px;
      height:92px;
      margin:0 auto 26px;
      border:1px solid rgba(150,220,255,.3);
      border-radius:50%;
      box-shadow:inset 0 0 28px rgba(84,183,255,.05), 0 0 30px rgba(84,183,255,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      transform:scale(.84);
      animation:appear .9s ease .3s forwards;
    }

    .openingMark::before{
      content:"";
      width:40px;
      height:40px;
      border-top:2px solid rgba(235,247,255,.95);
      border-right:2px solid rgba(84,183,255,.8);
      border-radius:10px 24px 10px 24px;
      transform:rotate(45deg);
    }

    .openingTitle{
      font-size:clamp(34px,7vw,74px);
      font-weight:300;
      letter-spacing:.18em;
      color:#eef9ff;
      opacity:0;
      transform:translateY(8px);
      text-shadow:0 0 14px rgba(84,183,255,.25);
      animation:appearText 1s ease .75s forwards;
    }

    .openingSub{
      margin-top:14px;
      font-size:clamp(10px,1.5vw,16px);
      letter-spacing:.46em;
      color:#7ea9c7;
      opacity:0;
      animation:appearText .9s ease 1.1s forwards;
    }

    .openingStatus{
      margin-top:20px;
      font-size:10px;
      letter-spacing:.28em;
      color:#5d7285;
      opacity:0;
      animation:appearText .8s ease 1.45s forwards;
    }

    @keyframes glow{
      0%,100%{opacity:.5;transform:scale(.96);}
      50%{opacity:1;transform:scale(1.04);}
    }

    @keyframes sweep{
      0%{left:-220px;opacity:0;}
      15%{opacity:1;}
      85%{opacity:1;}
      100%{left:calc(100% + 220px);opacity:0;}
    }

    @keyframes appear{
      to{opacity:1;transform:scale(1);}
    }

    @keyframes appearText{
      to{opacity:1;transform:translateY(0);}
    }

    #app{
      position:relative;
      width:100%;
      height:100%;
      background:#05080d;
      overflow:hidden;
    }

    /* ===== 本体フレーム ===== */

    .headUnit{
      position:absolute;
      inset:0;
      padding:18px 18px calc(112px + env(safe-area-inset-bottom)) 18px;
      background:
        linear-gradient(180deg,#0a0d12,#0b1016 35%,#080b10);
    }

    .screenFrame{
      position:relative;
      width:100%;
      height:100%;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.06);
      background:
        linear-gradient(180deg,#10161d,#0a0f15);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.02),
        inset 0 0 30px rgba(255,255,255,.02);
      overflow:hidden;
    }

    .topGuideBar{
      position:absolute;
      z-index:500;
      top:12px;
      left:12px;
      right:12px;
      height:64px;
      border-radius:12px;
      display:grid;
      grid-template-columns:78px 1fr 170px;
      align-items:center;
      background:
        linear-gradient(180deg,rgba(17,28,40,.94),rgba(8,14,21,.94));
      border:1px solid rgba(150,200,255,.12);
      box-shadow:0 8px 24px rgba(0,0,0,.35);
      overflow:hidden;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .guideArrow{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:42px;
      color:#a8dfff;
      background:
        linear-gradient(180deg,rgba(36,60,90,.45),rgba(16,28,42,.16));
      border-right:1px solid rgba(150,200,255,.08);
      text-shadow:0 0 12px rgba(84,183,255,.22);
    }

    .guideMain{
      min-width:0;
      padding:0 16px;
    }

    .guideDistance{
      font-size:22px;
      font-weight:300;
      color:#f4fbff;
      line-height:1.1;
    }

    .guideText{
      margin-top:5px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:13px;
      color:#bfd8ea;
    }

    .guideMeta{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-end;
      padding:0 14px;
      gap:4px;
      color:#d8efff;
      font-size:12px;
      background:
        linear-gradient(180deg,rgba(18,37,59,.55),rgba(9,18,28,.2));
      border-left:1px solid rgba(150,200,255,.08);
    }

    .guideMeta small{
      color:#83a4bd;
      font-size:10px;
      letter-spacing:.08em;
    }

    .contentArea{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:1fr 270px;
      gap:0;
    }

    .mapArea{
      position:relative;
      min-width:0;
      background:#0e141b;
      border-right:1px solid rgba(255,255,255,.05);
    }

    #map{
      position:absolute;
      inset:0;
      z-index:1;
    }

    .leaflet-control-zoom,
    .leaflet-control-attribution{
      display:none;
    }

    .searchOverlay{
      position:absolute;
      z-index:450;
      left:14px;
      bottom:118px;
      width:min(520px, calc(100% - 28px));
      display:flex;
      gap:10px;
      padding:10px;
      border-radius:14px;
      background:rgba(8,13,20,.88);
      border:1px solid rgba(150,200,255,.12);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .searchOverlay input{
      flex:1;
      min-width:0;
      height:46px;
      padding:0 14px;
      border-radius:12px;
      border:1px solid rgba(150,200,255,.09);
      background:rgba(255,255,255,.04);
      color:white;
      font-size:15px;
    }

    .searchOverlay input::placeholder{
      color:#6f8498;
    }

    .searchAction{
      width:52px;
      height:46px;
      border-radius:12px;
      color:#e7f7ff;
      font-size:18px;
      background:linear-gradient(180deg,#14304b,#0a1828);
      border:1px solid rgba(84,183,255,.25);
      box-shadow:inset 0 0 12px rgba(84,183,255,.05);
    }

    .routeSummary{
      position:absolute;
      z-index:450;
      left:14px;
      top:90px;
      padding:12px 15px;
      min-width:220px;
      border-radius:13px;
      background:rgba(7,12,18,.88);
      border:1px solid rgba(150,200,255,.12);
      color:#eff9ff;
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .routeSummaryTitle{
      color:#7fa3bd;
      font-size:10px;
      letter-spacing:.14em;
      margin-bottom:5px;
    }

    .routeSummaryValue{
      font-size:19px;
      font-weight:300;
    }

    .routeSummarySub{
      margin-top:3px;
      color:#b7cfdf;
      font-size:12px;
    }

    .miniCurrentBtn{
      position:absolute;
      z-index:450;
      right:16px;
      bottom:120px;
      width:60px;
      height:60px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      color:#dff3ff;
      background:linear-gradient(180deg,rgba(22,35,50,.96),rgba(8,13,19,.96));
      border:1px solid rgba(150,200,255,.14);
      box-shadow:var(--shadow);
    }

    /* ===== 右パネル ===== */

    .rightArea{
      position:relative;
      z-index:20;
      display:flex;
      flex-direction:column;
      background:
        linear-gradient(180deg,#1f0f09,#29140d 35%,#1b0d09 60%,#0d1622 100%);
    }

    .mediaTop{
      position:relative;
      height:210px;
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:
        linear-gradient(135deg, rgba(255,180,80,.10), rgba(255,120,60,.04));
    }

    .mediaThumb{
      width:100%;
      height:100%;
      border-radius:12px;
      overflow:hidden;
      position:relative;
      background:
        linear-gradient(135deg, #ffcf66, #f58e3a 40%, #7e2a10 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    }

    .mediaThumb::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 65% 25%, rgba(255,255,255,.35), transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.16), transparent 40%);
      mix-blend-mode:screen;
    }

    .mediaCrowd{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:48%;
      background:
        linear-gradient(180deg, transparent, rgba(0,0,0,.2)),
        linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.35));
    }

    .mediaTitle{
      position:absolute;
      left:16px;
      bottom:12px;
      right:16px;
      font-size:15px;
      font-weight:600;
      letter-spacing:.02em;
      text-shadow:0 2px 10px rgba(0,0,0,.35);
    }

    .mediaControls{
      padding:14px 14px 12px;
      border-bottom:1px solid rgba(255,255,255,.05);
      background:
        linear-gradient(180deg, rgba(79,35,18,.60), rgba(36,16,11,.86));
    }

    .mediaMode{
      color:#efc37a;
      font-size:13px;
      letter-spacing:.06em;
      margin-bottom:10px;
    }

    .mediaButtons{
      display:flex;
      justify-content:center;
      gap:16px;
    }

    .circleBtn{
      width:48px;
      height:48px;
      border-radius:50%;
      color:#fff3dd;
      font-size:18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.18));
      border:1px solid rgba(255,220,180,.14);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .rightApps{
      flex:1;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1px;
      background:rgba(255,255,255,.06);
    }

    .rightTile{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:#dcefff;
      background:
        linear-gradient(180deg,#203247,#162536);
      font-size:12px;
      letter-spacing:.03em;
    }

    .rightTileIcon{
      width:46px;
      height:46px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.09);
      font-size:22px;
    }

    /* ===== 下部ボタン ===== */

    .hardwareBar{
      position:absolute;
      left:18px;
      right:18px;
      bottom:18px;
      z-index:900;
      height:82px;
      border-radius:14px;
      padding:8px 12px calc(8px + env(safe-area-inset-bottom));
      display:grid;
      grid-template-columns:140px 1fr;
      align-items:center;
      background:
        linear-gradient(180deg,#050709,#020304);
      border:1px solid rgba(255,255,255,.05);
      box-shadow:
        0 14px 30px rgba(0,0,0,.46),
        inset 0 1px 0 rgba(255,255,255,.03);
    }

    .leftStatus{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      padding-left:8px;
      gap:4px;
      color:#dbeeff;
    }

    .leftStatusTop{
      font-size:12px;
      color:#8eb0c6;
    }

    .clock{
      font-size:34px;
      line-height:1;
      font-weight:200;
      letter-spacing:-.04em;
    }

    .buttonStrip{
      display:grid;
      grid-template-columns:repeat(6, 1fr);
      gap:10px;
      padding-left:12px;
    }

    .hwBtn{
      position:relative;
      height:54px;
      border-radius:8px;
      color:#eaf8ff;
      font-size:11px;
      letter-spacing:.05em;
      background:
        linear-gradient(180deg,#11161d,#05080d);
      border:1px solid rgba(255,255,255,.06);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        inset 0 -10px 18px rgba(0,0,0,.35);
    }

    .hwBtn .small{
      display:block;
      margin-top:2px;
      color:#ff7e61;
      font-size:9px;
      letter-spacing:.08em;
    }

    .hwBtn.active{
      color:#fff;
      border-color:rgba(84,183,255,.35);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        inset 0 0 18px rgba(84,183,255,.07),
        0 0 15px rgba(84,183,255,.08);
    }

    /* ===== オーバーレイ ===== */

    .overlay{
      position:absolute;
      z-index:700;
      inset:0;
      background:rgba(0,0,0,.36);
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
    }

    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .panel{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%) scale(.96);
      width:min(820px, calc(100% - 34px));
      border-radius:18px;
      background:
        linear-gradient(180deg, rgba(14,22,31,.98), rgba(8,13,18,.98));
      border:1px solid rgba(150,200,255,.14);
      box-shadow:0 25px 60px rgba(0,0,0,.55);
      opacity:0;
      transition:.22s ease;
      overflow:hidden;
    }

    .overlay.show .panel{
      opacity:1;
      transform:translate(-50%, -50%) scale(1);
    }

    .panelHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:15px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:linear-gradient(180deg,rgba(20,33,47,.88),rgba(10,16,24,.88));
    }

    .panelTitle{
      font-size:15px;
      letter-spacing:.10em;
      color:#e8f7ff;
    }

    .closeBtn{
      width:38px;
      height:38px;
      border-radius:10px;
      background:rgba(255,255,255,.06);
      color:#e6f7ff;
      font-size:18px;
      border:1px solid rgba(255,255,255,.05);
    }

    .panelBody{
      padding:18px;
    }

    .tileGrid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:12px;
    }

    .menuTile{
      min-height:92px;
      padding:14px;
      border-radius:14px;
      text-align:left;
      color:#eaf8ff;
      background:linear-gradient(180deg,#162433,#0c1520);
      border:1px solid rgba(150,200,255,.10);
    }

    .menuTile strong{
      display:block;
      margin-bottom:6px;
      font-size:14px;
    }

    .menuTile small{
      color:#87a2b6;
      font-size:11px;
    }

    .routeModes{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:12px;
      margin-bottom:14px;
    }

    .routeMode{
      height:54px;
      border-radius:12px;
      color:#d7efff;
      background:linear-gradient(180deg,#142435,#0b141f);
      border:1px solid rgba(150,200,255,.09);
      font-size:12px;
    }

    .routeMode.active{
      border-color:rgba(84,183,255,.32);
      box-shadow:inset 0 0 18px rgba(84,183,255,.07);
    }

    .routeActions{
      display:flex;
      gap:10px;
    }

    .routeAction{
      flex:1;
      height:48px;
      border-radius:12px;
      background:#101a26;
      color:#e6f8ff;
      border:1px solid rgba(150,200,255,.09);
    }

    .routeAction.main{
      background:linear-gradient(180deg,#16314d,#0b1726);
      border-color:rgba(84,183,255,.26);
    }

    .audioPanelInner{
      display:grid;
      grid-template-columns:220px 1fr;
      gap:18px;
    }

    .audioArt{
      height:220px;
      border-radius:16px;
      background:
        linear-gradient(135deg, #ffc866, #f58340 42%, #63200d 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
      position:relative;
      overflow:hidden;
    }

    .audioArt::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.18), transparent 35%);
    }

    .audioInfo{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:12px;
    }

    .audioInfo h3{
      margin:0;
      font-size:26px;
      font-weight:600;
    }

    .audioInfo p{
      margin:0;
      color:#90aabc;
      font-size:14px;
    }

    .audioLargeButtons{
      display:flex;
      gap:12px;
      margin-top:10px;
    }

    .audioLargeButtons button{
      min-width:70px;
      height:54px;
      border-radius:14px;
      color:#eff9ff;
      font-size:20px;
      background:linear-gradient(180deg,#152537,#0b141f);
      border:1px solid rgba(150,200,255,.10);
    }

    .toast{
      position:absolute;
      z-index:9500;
      top:86px;
      left:50%;
      transform:translateX(-50%) translateY(-10px);
      padding:12px 18px;
      border-radius:14px;
      color:#e9f8ff;
      font-size:12px;
      background:rgba(7,12,18,.96);
      border:1px solid rgba(150,200,255,.14);
      box-shadow:var(--shadow);
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .myMarker{
      width:22px;
      height:22px;
      border-radius:50%;
      border:3px solid #f2fbff;
      background:#49adff;
      box-shadow:
        0 0 0 7px rgba(73,173,255,.18),
        0 0 18px rgba(73,173,255,.6);
    }

    .destMarker{
      width:24px;
      height:24px;
      border:2px solid #fff;
      border-radius:7px 7px 7px 2px;
      background:#64c4ff;
      transform:rotate(-45deg);
      box-shadow:0 0 16px rgba(100,196,255,.52);
    }

    @media (max-width: 920px){
      .contentArea{
        grid-template-columns:1fr 220px;
      }

      .audioPanelInner{
        grid-template-columns:1fr;
      }

      .audioArt{
        height:180px;
      }
    }

    @media (max-width: 760px){
      .contentArea{
        grid-template-columns:1fr;
      }

      .rightArea{
        display:none;
      }

      .topGuideBar{
        grid-template-columns:70px 1fr 120px;
      }

      .buttonStrip{
        grid-template-columns:repeat(3, 1fr);
      }

      .hardwareBar{
        height:124px;
        grid-template-columns:1fr;
        gap:8px;
      }

      .leftStatus{
        flex-direction:row;
        align-items:center;
        justify-content:space-between;
        padding-left:0;
      }

      .clock{
        font-size:24px;
      }

      .tileGrid{
        grid-template-columns:1fr 1fr;
      }

      .routeModes{
        grid-template-columns:1fr 1fr;
      }
    }

    @media (orientation:portrait){
      body::after{
        content:"横向きでの使用がおすすめです";
        position:fixed;
        z-index:100000;
        left:20px;
        right:20px;
        bottom:20px;
        padding:12px;
        text-align:center;
        color:#fff;
        background:rgba(0,0,0,.76);
        border-radius:14px;
        font-size:12px;
        pointer-events:none;
      }
    }
  </style>
</head>
<body>

      <div class="buttonStrip">

    <!-- MENU -->
    <div class="overlay" id="menuOverlay">
      <div class="panel">

            目的地: <span id="routeDestName">---</span>

          <div class="routeModes">
            <button class="routeMode active" data-mode="normal">一般優先</button>
            <button class="routeMode" data-mode="fast">高速優先</button>

          </div>

          <div class="routeActions">

            <button class="routeAction main" id="startRouteBtn">案内開始</button>

    <!-- APPS -->
    <div class="overlay" id="appsOverlay">
      <div class="panel">
        <div class="panelHeader">
          <div class="panelTitle">APPS</div>
          <button class="closeBtn" data-close="appsOverlay">×</button>
        </div>

        <div class="panelBody">
          <div class="tileGrid">
            <button class="menuTile" id="appTileMap">
              <strong>ナビ</strong>
              <small>地図画面に戻る</small>
            </button>

            <button class="menuTile" id="appTileAudio">
              <strong>オーディオ</strong>
              <small>音楽画面を開く</small>
            </button>

              <small>ダミー画面を表示</small>
            </button>

            <button class="menuTile" id="appTileSettings">
              <strong>設定</strong>
              <small>ダミー画面を表示</small>
            </button>

            <button class="menuTile" id="appTileCurrent">
              <strong>現在地</strong>
              <small>現在地に戻る</small>
            </button>

            <button class="menuTile" id="appTileHome">

    <!-- AUDIO -->
    <div class="overlay" id="audioOverlay">
      <div class="panel">
        <div class="panelHeader">
          <div class="panelTitle">AUDIO</div>
          <button class="closeBtn" data-close="audioOverlay">×</button>
        </div>

        <div class="panelBody">
          <div class="audioPanelInner">
            <div class="audioArt"></div>

            <div class="audioInfo">
              <h3 id="audioSongTitle">Drive Music</h3>
              <p id="audioArtist">Night Highway Session</p>
              <p>デリカ純正風のオーディオ画面イメージ</p>

              <div class="audioLargeButtons">
                <button id="audioPrevLarge">⏮</button>
                <button id="audioPlayLarge">▶</button>
                <button id="audioNextLarge">⏭</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    /* =========================
       起動画面
    ========================= */
    const opening = document.getElementById("opening");
    setTimeout(() => {
      opening.classList.add("hide");
      setTimeout(() => {
        opening.style.display = "none";
      }, 850);
    }, 3300);

    /* =========================
       時計
    ========================= */
    const clockEl = document.getElementById("clock");
    function updateClock(){
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      clockEl.textContent = `${hh}:${mm}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* =========================
       マップ
    ========================= */
    const DEFAULT_LAT = 35.6073;
    const DEFAULT_LON = 140.1063;

    let currentLat = null;
    let currentLon = null;
    let currentMarker = null;
    let destinationMarker = null;
    let destination = null;
    let routeLine = null;
    let currentRoute = null;
    let selectedRouteMode = "normal";
    let isDarkMapTone = true;
    let isPlaying = false;

    const gpsStatus = document.getElementById("gpsStatus");
    const routeSummaryValue = document.getElementById("routeSummaryValue");
    const routeSummarySub = document.getElementById("routeSummarySub");

    const guideArrow = document.getElementById("guideArrow");
    const guideDistance = document.getElementById("guideDistance");
    const guideText = document.getElementById("guideText");
    const metaEta = document.getElementById("metaEta");

    const map = L.map("map", {
      zoomControl:false,
      attributionControl:false,
      preferCanvas:true
    }).setView([DEFAULT_LAT, DEFAULT_LON], 14);

    const tileLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom:19}
    ).addTo(map);

    function applyMapTone(){
      const pane = document.querySelector(".leaflet-tile-pane");
      if(!pane) return;
      if(isDarkMapTone){
        pane.style.filter = "saturate(.84) brightness(.78) contrast(1.04)";
      }else{
        pane.style.filter = "saturate(.96) brightness(1) contrast(1)";
      }
    }

    setTimeout(applyMapTone, 300);

    const myIcon = L.divIcon({
      className:"",
      html:'<div class="myMarker"></div>',
      iconSize:[22,22],
      iconAnchor:[11,11]
    });

    const destIcon = L.divIcon({
      className:"",
      html:'<div class="destMarker"></div>',
      iconSize:[24,24],
      iconAnchor:[8,21]
    });

    function updateCurrentMarker(){
      if(currentLat === null || currentLon === null) return;

      if(!currentMarker){
        currentMarker = L.marker([currentLat, currentLon], {icon:myIcon}).addTo(map);
      }else{
        currentMarker.setLatLng([currentLat, currentLon]);
      }
    }

    function setDestination(lat, lon, name){
      destination = {lat, lon, name};

      if(destinationMarker){
        map.removeLayer(destinationMarker);
      }

      destinationMarker = L.marker([lat, lon], {icon:destIcon}).addTo(map);

      document.getElementById("routeDestName").textContent = name;
      routeSummaryValue.textContent = "目的地設定済み";
      routeSummarySub.textContent = name;
      guideDistance.textContent = "目的地設定";
      guideText.textContent = name;
      guideArrow.textContent = "↑";
    }

    function startGPS(){
      if(!navigator.geolocation){
        gpsStatus.textContent = "GPS非対応";
        showToast("この端末ではGPSが使えません");
        return;
      }

      gpsStatus.textContent = "GPS取得中";
      routeSummaryValue.textContent = "GPS取得中";
      routeSummarySub.textContent = "現在地を待っています";

      navigator.geolocation.watchPosition(
        pos => {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;

          gpsStatus.textContent = "GPS受信中";
          routeSummaryValue.textContent = "現在地受信中";

          updateCurrentMarker();

          if(!currentRoute){
            routeSummarySub.textContent = "目的地を検索してください";
          }

          if(currentLat !== null && currentLon !== null && !currentRoute){
            map.setView([currentLat, currentLon], Math.max(map.getZoom(), 15), {animate:true});
          }
        },
        err => {
          gpsStatus.textContent = "GPS取得失敗";
          if(err.code === 1){
            showToast("位置情報の使用を許可してください");
          }else{
            showToast("現在地を取得できませんでした");
          }
        },
        {
          enableHighAccuracy:true,
          maximumAge:1000,
          timeout:12000
        }
      );
    }
    startGPS();

    /* =========================
       検索
    ========================= */
    const searchInput = document.getElementById("searchInput");
    document.getElementById("searchBtn").addEventListener("click", searchPlace);
    searchInput.addEventListener("keydown", e => {
      if(e.key === "Enter") searchPlace();
    });

    async function searchPlace(){
      const query = searchInput.value.trim();

      if(!query){
        showToast("住所または施設名を入力してください");
        return;
      }

      showToast("検索中...");
      try{
        const url =
          "https://nominatim.openstreetmap.org/search" +
          "?format=jsonv2&limit=5&countrycodes=jp&accept-language=ja&q=" +
          encodeURIComponent(query);

        const response = await fetch(url);
        const results = await response.json();

        if(!results.length){
          showToast("場所が見つかりませんでした");
          return;
        }

        const result = results[0];
        const lat = Number(result.lat);
        const lon = Number(result.lon);
        const name = result.display_name || query;

        setDestination(lat, lon, name);

        map.flyTo([lat, lon], 16, {duration:0.8});
        openOverlay("routeOverlay");
      }catch(error){
        console.error(error);
        showToast("検索に失敗しました");
      }
    }

    /* =========================
       ルート
    ========================= */
    document.querySelectorAll(".routeMode").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".routeMode").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        selectedRouteMode = btn.dataset.mode;
      });
    });

    document.getElementById("startRouteBtn").addEventListener("click", calculateRoute);

    function chooseRoute(routes){
      if(routes.length === 1) return routes[0];

      if(selectedRouteMode === "fast"){
        return [...routes].sort((a,b) => a.duration - b.duration)[0];
      }

      if(selectedRouteMode === "short"){
        return [...routes].sort((a,b) => a.distance - b.distance)[0];
      }

      if(selectedRouteMode === "eco"){
        return [...routes].sort((a,b) => (a.distance + a.duration * 4) - (b.distance + b.duration * 4))[0];
      }

      return routes[0];
    }

    async function calculateRoute(){
      if(currentLat === null || currentLon === null){
        showToast("現在地が取得できていません");
        return;
      }

      if(!destination){
        showToast("目的地を設定してください");
        return;
      }

      showToast("ルート検索中...");

      try{
        const url =
          "https://router.project-osrm.org/route/v1/driving/" +
          `${currentLon},${currentLat};${destination.lon},${destination.lat}` +
          "?overview=full&geometries=geojson&steps=true&alternatives=true";

        const response = await fetch(url);
        const json = await response.json();

        if(!json.routes || !json.routes.length){
          showToast("ルートが見つかりませんでした");
          return;
        }

        currentRoute = chooseRoute(json.routes);
        drawRoute(currentRoute.geometry.coordinates);
        updateRouteInfo(currentRoute);

        closeOverlay("routeOverlay");
        showToast("案内を開始しました");
      }catch(error){
        console.error(error);
        showToast("ルート取得に失敗しました");
      }
    }

    function drawRoute(coordinates){
      if(routeLine){
        map.removeLayer(routeLine);
      }

      const latLngs = coordinates.map(c => [c[1], c[0]]);
      routeLine = L.polyline(latLngs, {
        color:"#58baff",
        weight:7,
        opacity:0.95,
        lineCap:"round",
        lineJoin:"round"
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), {
        padding:[70,70]
      });
    }

    function updateRouteInfo(route){
      const km = route.distance / 1000;
      const min = route.duration / 60;
      const arrival = new Date(Date.now() + route.duration * 1000);
      const arrivalText =
        String(arrival.getHours()).padStart(2, "0") +
        ":" +
        String(arrival.getMinutes()).padStart(2, "0");

      routeSummaryValue.textContent = `${km.toFixed(km < 10 ? 1 : 0)} km`;
      routeSummarySub.textContent = `${Math.round(min)}分 / 到着 ${arrivalText}`;

      guideDistance.textContent = `${Math.round(min)}分`;
      guideText.textContent = destination ? destination.name : "目的地";
      metaEta.textContent = arrivalText;

      if(route.legs && route.legs[0] && route.legs[0].steps && route.legs[0].steps.length > 1){
        const nextStep = route.legs[0].steps[1];
        const modifier = nextStep.maneuver?.modifier || "";
        guideArrow.textContent = arrowByModifier(modifier);
        guideText.textContent = toJapaneseInstruction(nextStep);
        guideDistance.textContent = formatDistance(nextStep.distance || 0);
      }
    }

    function arrowByModifier(mod){
      if(mod.includes("uturn")) return "↶";
      if(mod.includes("sharp right")) return "↘";
      if(mod.includes("slight right")) return "↗";
      if(mod.includes("right")) return "→";
      if(mod.includes("sharp left")) return "↙";
      if(mod.includes("slight left")) return "↖";
      if(mod.includes("left")) return "←";
      return "↑";
    }

    function toJapaneseInstruction(step){
      const mod = step.maneuver?.modifier || "";
      const road = step.name || "";
      let action = "直進です";

      if(mod.includes("uturn")) action = "Uターンです";
      else if(mod.includes("sharp right")) action = "大きく右方向です";
      else if(mod.includes("slight right")) action = "斜め右方向です";
      else if(mod.includes("right")) action = "右方向です";
      else if(mod.includes("sharp left")) action = "大きく左方向です";
      else if(mod.includes("slight left")) action = "斜め左方向です";
      else if(mod.includes("left")) action = "左方向です";

      if(road){
        return `${road}へ${action}`;
      }
      return action;
    }

    function formatDistance(meters){
      if(meters < 1000){
        return `${Math.max(0, Math.round(meters / 10) * 10)} m`;
      }
      return `${(meters / 1000).toFixed(meters < 10000 ? 1 : 0)} km`;
    }

    /* =========================
       現在地へ
    ========================= */
    function goCurrent(){
      if(currentLat === null || currentLon === null){
        showToast("現在地を取得中です");
        return;
      }
      map.flyTo([currentLat, currentLon], 17, {duration:0.7});
    }

    document.getElementById("miniCurrentBtn").addEventListener("click", goCurrent);
    document.getElementById("btnCurrent").addEventListener("click", goCurrent);

    /* =========================
       MENU / APPS / AUDIO
    ========================= */
    function openOverlay(id){
      document.getElementById(id).classList.add("show");
    }

    function closeOverlay(id){
      document.getElementById(id).classList.remove("show");
    }

    function closeAllOverlays(){
      document.querySelectorAll(".overlay").forEach(el => el.classList.remove("show"));
    }

    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => closeOverlay(btn.dataset.close));
    });

    document.querySelectorAll(".overlay").forEach(overlay => {
      overlay.addEventListener("click", e => {
        if(e.target === overlay){
          overlay.classList.remove("show");
        }
      });
    });

    document.getElementById("btnMenu").addEventListener("click", () => openOverlay("menuOverlay"));
    document.getElementById("btnAudio").addEventListener("click", () => openOverlay("audioOverlay"));
    document.getElementById("btnBack").addEventListener("click", () => {
      closeAllOverlays();
      showToast("前の画面に戻りました");
    });

    document.getElementById("btnHome").addEventListener("click", () => {
      closeAllOverlays();
      showToast("ホーム画面イメージ");
    });

    document.getElementById("btnNavi").addEventListener("click", () => {
      closeAllOverlays();
      showToast("ナビ画面です");
    });

    document.getElementById("tileAudio").addEventListener("click", () => openOverlay("audioOverlay"));
    document.getElementById("tileApps").addEventListener("click", () => openOverlay("appsOverlay"));
    document.getElementById("tileMap").addEventListener("click", () => {
      closeAllOverlays();
      showToast("地図画面です");
    });
    document.getElementById("tilePhone").addEventListener("click", () => showToast("電話機能のダミーです"));

    document.getElementById("openAppsFromMenu").addEventListener("click", () => {
      closeOverlay("menuOverlay");
      openOverlay("appsOverlay");
    });

    document.getElementById("openAudioFromMenu").addEventListener("click", () => {
      closeOverlay("menuOverlay");
      openOverlay("audioOverlay");
    });

    document.getElementById("appTileMap").addEventListener("click", () => {
      closeOverlay("appsOverlay");
      showToast("ナビ画面に戻りました");
    });

    document.getElementById("appTileAudio").addEventListener("click", () => {
      closeOverlay("appsOverlay");
      openOverlay("audioOverlay");
    });

    document.getElementById("appTilePhone").addEventListener("click", () => showToast("電話アプリのダミーです"));
    document.getElementById("appTileSettings").addEventListener("click", () => showToast("設定画面は次段階で追加できます"));
    document.getElementById("appTileCurrent").addEventListener("click", () => {
      closeOverlay("appsOverlay");
      goCurrent();
    });

    document.getElementById("appTileHome").addEventListener("click", () => {
      closeOverlay("appsOverlay");
      goHomeRoute();
    });

    /* =========================
       自宅
    ========================= */
    document.getElementById("homeRegisterBtn").addEventListener("click", () => {
      if(currentLat === null || currentLon === null){
        showToast("現在地を取得してから登録してください");
        return;
      }

      localStorage.setItem("delicaHome", JSON.stringify({
        lat:currentLat,
        lon:currentLon
      }));

      showToast("現在地を自宅に登録しました");
    });

    document.getElementById("goHomeBtn").addEventListener("click", goHomeRoute);

    function goHomeRoute(){
      const raw = localStorage.getItem("delicaHome");

      if(!raw){
        showToast("自宅が登録されていません");
        return;
      }

      const home = JSON.parse(raw);
      setDestination(home.lat, home.lon, "自宅");

      map.flyTo([home.lat, home.lon], 16, {duration:0.7});
      openOverlay("routeOverlay");
    }

    /* =========================
       ルート消去
    ========================= */
    document.getElementById("clearRouteBtn").addEventListener("click", clearRoute);

    function clearRoute(){
      currentRoute = null;

      if(routeLine){
        map.removeLayer(routeLine);
        routeLine = null;
      }

      if(destinationMarker){
        map.removeLayer(destinationMarker);
        destinationMarker = null;
      }

      destination = null;

      routeSummaryValue.textContent = "ルートなし";
      routeSummarySub.textContent = "目的地を検索してください";
      guideDistance.textContent = "ルート未設定";
      guideText.textContent = "目的地を検索してください";
      guideArrow.textContent = "↑";
      metaEta.textContent = "--:--";

      closeAllOverlays();
      showToast("ルートを消去しました");
    }

    /* =========================
       画面トーン切替
    ========================= */
    document.getElementById("toggleNightBtn").addEventListener("click", () => {
      isDarkMapTone = !isDarkMapTone;
      applyMapTone();
      showToast(isDarkMapTone ? "夜っぽい表示にしました" : "明るい表示にしました");
    });

    /* =========================
       オーディオ
    ========================= */
    const songs = [
      {title:"Drive Music", artist:"Night Highway Session"},
      {title:"Midnight Bay", artist:"Neon Cruise"},
      {title:"Sunrise Route", artist:"Morning Run"}
    ];
    let songIndex = 0;

    function reflectSong(){
      const song = songs[songIndex];
      document.getElementById("audioSongTitle").textContent = song.title;
      document.getElementById("audioArtist").textContent = song.artist;
      document.getElementById("mediaNowTitle").textContent = song.title;
    }

    function prevSong(){
      songIndex = (songIndex - 1 + songs.length) % songs.length;
      reflectSong();
      showToast("前の曲へ");
    }

    function nextSong(){
      songIndex = (songIndex + 1) % songs.length;
      reflectSong();
      showToast("次の曲へ");
    }

    function togglePlay(){
      isPlaying = !isPlaying;
      const text = isPlaying ? "⏸" : "▶";
      document.getElementById("playPauseBtn").textContent = text;
      document.getElementById("audioPlayLarge").textContent = text;
      showToast(isPlaying ? "再生" : "一時停止");
    }

    document.getElementById("prevTrackBtn").addEventListener("click", prevSong);
    document.getElementById("nextTrackBtn").addEventListener("click", nextSong);
    document.getElementById("playPauseBtn").addEventListener("click", togglePlay);

    document.getElementById("audioPrevLarge").addEventListener("click", prevSong);
    document.getElementById("audioNextLarge").addEventListener("click", nextSong);
    document.getElementById("audioPlayLarge").addEventListener("click", togglePlay);

    reflectSong();

    /* =========================
       トースト
    ========================= */
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(message){
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    /* =========================
       リサイズ
    ========================= */
    window.addEventListener("resize", () => {
      map.invalidateSize();
      applyMapTone();
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        map.invalidateSize();
        applyMapTone();
      }, 350);
    });
  </script>
</body>
</html>
